<section class="pyodide-exercise" data-pyodide-exercise>
  <div class="pyodide-exercise__header">
    <div>
      <p class="pyodide-exercise__eyebrow">Try It Yourself</p>
      <h3 class="pyodide-exercise__title">{{ include.title | default: "Latihan mandiri" | escape }}</h3>
    </div>
    <span class="pyodide-exercise__runtime">
      <span class="pyodide-exercise__runtime-dot" aria-hidden="true"></span>
      Python in browser
    </span>
  </div>

  {% if include.prompt %}
    <p class="pyodide-exercise__prompt">{{ include.prompt | escape }}</p>
  {% endif %}

  <div class="pyodide-editor">
    <div class="pyodide-editor__topbar">
      <div class="pyodide-editor__traffic" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="pyodide-editor__filename">main.py</div>
      <div class="pyodide-editor__language">Python</div>
    </div>

    <label class="pyodide-editor__label" for="{{ include.id | escape }}-editor">Starter code</label>
    <div class="pyodide-editor__body">
      <div class="pyodide-editor__gutter" data-pyodide-line-numbers aria-hidden="true"><span>1</span></div>
      <textarea id="{{ include.id | escape }}-editor" class="pyodide-exercise__editor" data-pyodide-editor spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Python code editor">{{ include.starter | default: "" | escape }}</textarea>
    </div>

    <div class="pyodide-editor__footer">
      <span data-pyodide-cursor>Ln 1, Col 1</span>
      <span>Spaces: 4</span>
      <span>UTF-8</span>
      <span>Python</span>
    </div>
  </div>

  <div class="pyodide-exercise__actions">
    <button type="button" class="pyodide-exercise__run" data-pyodide-run>
      <span class="pyodide-exercise__run-icon" aria-hidden="true"></span>
      Run
    </button>
    <button type="button" class="pyodide-exercise__reset" data-pyodide-reset>Reset</button>
  </div>

  <div class="pyodide-output" data-pyodide-output-panel hidden>
    <div class="pyodide-output__header">
      <span>Output</span>
      <span class="pyodide-output__status" data-pyodide-output-state></span>
    </div>
    <pre class="pyodide-exercise__output" data-pyodide-output aria-live="polite" hidden></pre>
  </div>
</section>
