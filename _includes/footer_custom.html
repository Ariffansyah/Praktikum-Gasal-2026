<script>
  (function () {
    var navList = document.querySelector('.aux-nav-list');
    if (!navList || !navList.firstElementChild) {
      return;
    }

    var darkToggle = navList.firstElementChild;
    if (darkToggle.getAttribute('data-theme-bound') === 'true') {
      return;
    }

    darkToggle.setAttribute('data-theme-bound', 'true');
    darkToggle.setAttribute('aria-label', 'Toggle dark mode');
    darkToggle.addEventListener('click', function (event) {
      event.preventDefault();
      toggleDark();
    });

    var nimCookieName = 'oop_student_nim';

    if (!document.querySelector('[data-nim-reset]')) {
      var resetItem = document.createElement('li');
      var resetButton = document.createElement('button');

      resetItem.className = 'aux-nav-list-item';
      resetButton.type = 'button';
      resetButton.className = 'site-button nim-reset-button';
      resetButton.setAttribute('data-nim-reset', 'true');
      resetButton.setAttribute('aria-label', 'Reset NIM');
      resetButton.textContent = 'Reset NIM';

      resetButton.addEventListener('click', function () {
        document.cookie = nimCookieName + '=; max-age=0; path=/; SameSite=Lax';
        window.location.reload();
      });

      resetItem.appendChild(resetButton);
    }
  }());
</script>

{%- if site.footer_content -%}
  <p class="text-small mb-0">{{ site.footer_content }}</p>
{%- endif -%}
