<link
  rel="preload"
  href="{{ '/assets/css/just-the-docs-dark.css' | relative_url }}"
  as="style"
>

<!-- Dedicated stylesheet used by the persistent light/dark mode toggle. -->
<link
  id="jtdThemeCSS"
  rel="stylesheet"
  href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}"
>

<script>
  /* Persistent dark mode logic based on the course-site template. */
  jtd.getTheme = function () {
    var cssFile = document.getElementById('jtdThemeCSS') || document.querySelector('[rel="stylesheet"]');
    var cssFileHref = cssFile.getAttribute('href');
    return cssFileHref.substring(cssFileHref.lastIndexOf('-') + 1, cssFileHref.length - 4);
  };

  jtd.setTheme = function (theme) {
    var cssFile = document.getElementById('jtdThemeCSS') || document.querySelector('[rel="stylesheet"]');
    cssFile.setAttribute('href', cssFile.getAttribute('href').replace(jtd.getTheme(), theme));
  };

  function toggleDark() {
    var setDark = jtd.getTheme() !== 'dark';
    document.documentElement.setAttribute('data-theme', setDark ? 'dark' : 'default');
    jtd.setTheme(setDark ? 'dark' : 'default');

    try {
      localStorage.setItem('darkMode', String(setDark));
    } catch (error) {
      // Continue without persistence when storage is unavailable.
    }
  }

  try {
    if (localStorage.getItem('darkMode') === 'true') {
      toggleDark();
    }
  } catch (error) {
    // Continue with the default light theme when storage is unavailable.
  }
</script>

<script>
  /* The auxiliary navigation is rendered in the body, so bind the button there. */
  function bindDarkModeToggle() {
    var navList = document.querySelector('.aux-nav-list');
    if (!navList || !navList.firstElementChild) {
      return;
    }

    var darkToggle = navList.firstElementChild;
    if (darkToggle.getAttribute('data-theme-bound') === 'true') {
      return;
    }

    darkToggle.setAttribute('data-theme-bound', 'true');
    darkToggle.setAttribute('aria-label', 'Toggle dark mode');
    darkToggle.addEventListener('click', function (event) {
      event.preventDefault();
      toggleDark();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindDarkModeToggle);
  } else {
    bindDarkModeToggle();
  }
</script>
