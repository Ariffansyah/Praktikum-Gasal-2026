<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pyodide exercise test</title>
  <script src="/assets/js/pyodide-runner.js"></script>
</head>
<body>
  <main>
    <section class="pyodide-exercise" data-pyodide-exercise>
      <h1>Try It Yourself</h1>
      <label for="test-editor">Starter code</label>
      <textarea id="test-editor" data-pyodide-editor></textarea>
      <button type="button" data-pyodide-run>Run</button>
      <button type="button" data-pyodide-reset>Reset</button>
      <span data-pyodide-status>Starter code kosong dan siap diisi.</span>
      <pre data-pyodide-output hidden></pre>
    </section>
  </main>
</body>
</html>
