<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="runner.css">
  <script src="runner.js"></script>
</head>
<body>
  <section class="pyodide-exercise" data-pyodide-exercise>
    <div class="pyodide-editor">
      <div class="pyodide-editor__body">
        <div class="pyodide-editor__gutter" data-pyodide-line-numbers><span>1</span></div>
        <textarea class="pyodide-exercise__editor" data-pyodide-editor aria-label="Python code editor"></textarea>
      </div>
      <div class="pyodide-editor__footer"><span data-pyodide-cursor>Ln 1, Col 1</span></div>
    </div>
    <button type="button" data-pyodide-run>Run</button>
    <button type="button" data-pyodide-reset>Reset</button>
    <span data-pyodide-status>Starter code kosong dan siap diisi.</span>
    <div data-pyodide-output-panel hidden><span data-pyodide-output-state></span><pre data-pyodide-output></pre></div>
  </section>
</body>
</html>
